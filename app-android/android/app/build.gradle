apply plugin: 'com.android.application'

// Version of the whole project (root package.json), e.g. 0.3.1 -> versionCode 301.
def projectVersion = new groovy.json.JsonSlurper().parse(file('../../../package.json')).version
def versionParts = projectVersion.tokenize('.').collect { it.replaceAll('[^0-9]', '').toInteger() }
def projectVersionCode = versionParts[0] * 10000 + versionParts[1] * 100 + versionParts[2]

// Two editions from one source tree (see README-IT.md section 3):
//   personal  com.mitra247.musictools   "Musik Tools"  -> APK, has the extra personal features
//   play      com.mitra247.musicplayer  "Music Player" -> AAB for Google Play, no personal features
// The web part is built per edition by scripts/android.mjs (MUSIK_EDITION) before Gradle runs.
def playBuild = gradle.startParameter.taskNames.any { it.toLowerCase().contains('play') }

// Release signing. keystore.properties (not in git) next to this project's settings.gradle holds
// storeFile and keyAlias, and may hold storePassword/keyPassword. The passwords can instead come
// from the environment (MUSIK_STORE_PASSWORD, MUSIK_KEY_PASSWORD): scripts/android.mjs asks for
// them at build time, so nothing secret has to be written to disk. MUSIK_STORE_FILE and
// MUSIK_KEY_ALIAS can replace the two non-secret entries. Without a keystore and a password the
// release build stays unsigned.
def keystoreProps = new Properties()
def keystoreFile = rootProject.file('keystore.properties')
if (keystoreFile.exists()) keystoreFile.withInputStream { keystoreProps.load(it) }
def signStoreFile = keystoreProps['storeFile'] ?: System.getenv('MUSIK_STORE_FILE')
def signStorePassword = keystoreProps['storePassword'] ?: System.getenv('MUSIK_STORE_PASSWORD')
def signKeyAlias = keystoreProps['keyAlias'] ?: System.getenv('MUSIK_KEY_ALIAS') ?: 'upload'
def signKeyPassword = keystoreProps['keyPassword'] ?: System.getenv('MUSIK_KEY_PASSWORD') ?: signStorePassword
def signingReady = signStoreFile && signStorePassword

android {
    namespace = "com.musik.tools"
    compileSdk = rootProject.ext.compileSdkVersion
    buildFeatures {
        buildConfig = true
    }
    defaultConfig {
        applicationId "com.musik.tools"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode projectVersionCode
        versionName projectVersion
        buildConfigField "long", "BUILD_TIME", "${System.currentTimeMillis()}L"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    flavorDimensions 'edition'
    productFlavors {
        personal {
            dimension 'edition'
            applicationId "com.mitra247.musictools"
            resValue "string", "app_name", "Musik Tools"
            resValue "string", "title_activity_main", "Musik Tools"
            resValue "string", "package_name", "com.mitra247.musictools"
            resValue "string", "custom_url_scheme", "com.mitra247.musictools"
            manifestPlaceholders = [allowBackup: "true"]
            // The on-device downloader ships native libraries for 64-bit ARM phones only.
            ndk {
                abiFilters 'arm64-v8a'
            }
        }
        play {
            dimension 'edition'
            applicationId "com.mitra247.musicplayer"
            resValue "string", "app_name", "Music Player"
            resValue "string", "title_activity_main", "Music Player"
            resValue "string", "package_name", "com.mitra247.musicplayer"
            resValue "string", "custom_url_scheme", "com.mitra247.musicplayer"
            manifestPlaceholders = [allowBackup: "false"]
        }
    }
    packaging {
        jniLibs {
            // Personal edition: the downloader runs python and ffmpeg from extracted native libraries.
            useLegacyPackaging = !playBuild
        }
    }
    signingConfigs {
        release {
            if (signingReady) {
                storeFile rootProject.file(signStoreFile)
                storePassword signStorePassword
                keyAlias signKeyAlias
                keyPassword signKeyPassword
            }
        }
    }
    buildTypes {
        release {
            // R8 shrinking only for the Play build (the personal downloader libraries are not tuned for it).
            minifyEnabled playBuild
            shrinkResources playBuild
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (signingReady) signingConfig signingConfigs.release
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation "androidx.media:media:1.7.0"
    implementation "androidx.documentfile:documentfile:1.1.0"
    // Sign in with Google + access to the hidden app folder of the user's Drive (backup). All editions.
    implementation "com.google.android.gms:play-services-auth:21.3.0"
    // Personal edition only: on-device downloader and converter. Never part of the Play build.
    personalImplementation "io.github.junkfood02.youtubedl-android:library:0.18.1"
    personalImplementation "io.github.junkfood02.youtubedl-android:ffmpeg:0.18.1"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
